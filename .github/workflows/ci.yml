name: RankWorld AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Frontend tests, lint and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies including platform-specific optional binaries
        run: npm ci --include=optional --prefer-online
      - name: Verify Linux Rolldown binding is installed
        run: node -e "require.resolve('@rolldown/binding-linux-x64-gnu')"
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Confirm RankWorld AI is the root application
        run: |
          test -s dist/index.html
          test -d dist/assets
          test ! -e dist/rankvault/index.html

  functions:
    name: Firebase Functions source validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Functions dependencies (no lockfile is committed in this package)
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Unit tests
        run: node --test test/*.test.js test/*.test.mjs
      - name: Validate Functions source syntax
        run: |
          node --check index.js
          node --check aiProvider.js
          node --check questionValidation.js
          node --check cacheKeys.js
